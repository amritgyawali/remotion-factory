name: Render batch

# One whole video per runner, fanned out over a matrix of composition ids.
#
# This is the default. A 20-second reel renders in a few minutes on a runner,
# and splitting it across machines would spend more on startup, npm ci and
# browser launch than it saves on frames. Use render-fanout.yml only for a
# single composition longer than three minutes.
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: 'JSON array of composition ids, e.g. ["Day01A","Day01B"]'
        type: string
        required: true
      max_parallel:
        description: "How many runners may work at once"
        type: string
        default: "4"
      publish:
        description: "Upload to Postiz and schedule. Off renders and verifies only."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One bad composition must not cancel the others. Each is an independent
      # video with its own slot; losing three good renders because the fourth
      # had a typo is how a day's posting is lost to a five-minute fix.
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        composition: ${{ fromJson(inputs.compositions) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chrome runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxdamage1 libgbm1 libpango-1.0-0 \
            libcairo2 fonts-liberation || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - run: npm ci

      - name: Cache Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-v1

      - name: Bundle and measure the composition
        run: node scripts/bundle.mjs --id "${{ matrix.composition }}"

      # Audio first and at full length. It is muxed on at the end; the picture
      # is rendered muted so the two can never disagree about where zero is.
      - name: Render the soundtrack
        run: |
          node scripts/render-audio.mjs \
            --spec "audio/${{ matrix.composition }}.json" \
            --out "out/${{ matrix.composition }}.wav"

      - name: Verify the soundtrack
        run: |
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 "out/${{ matrix.composition }}.wav"

      - name: Render the picture
        run: |
          node scripts/render-chunk.mjs \
            --id "${{ matrix.composition }}" \
            --out "out/${{ matrix.composition }}-mute.mp4"

      # Remotion writes full-range frames. Handing a full-range yuv420p file to a
      # platform that assumes limited range is what makes blacks crush and whites
      # clip on playback while looking correct in the render.
      - name: Colour-normalise
        run: |
          ffmpeg -y -v error -i "out/${{ matrix.composition }}-mute.mp4" \
            -vf "scale=in_range=full:out_range=limited,format=yuv420p" \
            -c:v libx264 -profile:v high -crf 17 -preset slow \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -an "out/${{ matrix.composition }}-norm.mp4"

      - name: Mux picture and sound
        run: |
          ffmpeg -y -v error \
            -i "out/${{ matrix.composition }}-norm.mp4" \
            -i "out/${{ matrix.composition }}.wav" \
            -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -shortest "out/${{ matrix.composition }}.mp4"

      # Measurements, not impressions. Asserts the frame count against what the
      # bundle step measured from the real composition, so a silently truncated
      # encode fails here rather than on someone's feed.
      - name: Verify the finished file
        run: node scripts/verify-render.mjs --id "${{ matrix.composition }}"

      - name: Keep the master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: |
            out/${{ matrix.composition }}.mp4
            out/${{ matrix.composition }}.verify.json
          retention-days: 14
          if-no-files-found: warn

      # Last, and only on request. Everything above is reproducible and free to
      # retry; this step is neither.
      - name: Upload to Postiz and schedule
        if: ${{ inputs.publish }}
        env:
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/schedule-one.mjs --id "${{ matrix.composition }}"
