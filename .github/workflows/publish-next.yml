name: Publish next video

# DISABLED 2026-08-02. The schedule below is commented out, not deleted.
#
# This is the workflow that actually sends videos to Postiz. It was posting the
# duplicated logo-ladder renders four times a day. It stays off until the
# campaign is rebuilt from the source PDF and a person has approved what the
# queue holds. Re-enable by uncommenting the `schedule:` block.
on:
  # schedule:
    # Attempted every two hours, away from GitHub's busy top-of-hour window.
    # This is not the posting rate: scripts/due.mjs holds it to four a day by
    # requiring MIN_GAP_HOURS since the last post. Scheduled runs on a free
    # public repo are best effort — one fired 90 minutes late here and the
    # next was dropped outright — so the extra attempts are what make the four
    # land. On time, :32 UTC is :17 past the hour in Asia/Kathmandu.
    #    - cron: "32 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be posted; never touch Postiz or state.json"
        type: boolean
        default: true
      force:
        description: "Publish even if the minimum gap since the last post has not passed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shares the group with the render batch so the two never write state.json
  # at the same time.
  group: render
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No rendering here: this downloads a finished master and posts it, so a
    # run is about a minute. The old ceiling was sized for a render.
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Gate first. A run that is not due costs about fifteen seconds and
      # touches nothing.
      - id: due
        name: Is a post due?
        shell: bash
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || inputs.dry_run) && '1' || '0' }}
        run: |
          if [ "$FORCE" = "1" ]; then
            node scripts/due.mjs --github-output --force | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/due.mjs --github-output | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Not due yet
        if: steps.due.outputs.due != '1'
        shell: bash
        # Through the environment rather than ${{ }} interpolation, which would
        # paste the reason into the script itself.
        env:
          REASON: ${{ steps.due.outputs.reason }}
        run: |
          echo "::notice::Skipping — $REASON"
          echo "Nothing to do: $REASON" >> "$GITHUB_STEP_SUMMARY"

      # Credentials and channel wiring before anything else. Costs a second or
      # two and writes its verdict to the job summary, which is readable
      # without permission to download run logs.
      - name: Check Postiz
        if: steps.due.outputs.due == '1' && env.DRY_RUN != '1'
        env:
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/preflight-postiz.mjs

      # No apt, no browser, no audio pack: the video already exists.
      - name: Install dependencies
        if: steps.due.outputs.due == '1'
        run: npm install --no-audit --no-fund --omit=optional

      - name: Publish the oldest rendered video
        if: steps.due.outputs.due == '1'
        env:
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Reads the master back out of the week's Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unattended by default. The review gate was holding every rendered
          # video as "pending" forever, because approving one requires a person
          # at the dashboard — which is exactly what this factory is meant not
          # to need. Nothing is unguarded: the embargo still refuses any slot
          # before 25 August, publishBlockers still refuse a placeholder
          # channel, and verify-video still refuses a blank or silent render.
          #
          # Through a repository variable, not a literal, so review can be put
          # back from the GitHub settings UI with no commit and no laptop:
          # Settings > Secrets and variables > Actions > Variables,
          # REQUIRE_APPROVAL = 1.
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL || '0' }}
        run: node scripts/publish-one.mjs

      - name: Commit queue state
        if: steps.due.outputs.due == '1' && env.DRY_RUN != '1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if [ -f archive/manifest.json ]; then git add -- archive/manifest.json; fi

          # The video bytes live in a Release, never in git. Anything else
          # showing up staged means something wrote where it should not have.
          unexpected="$(git diff --cached --name-only \
            | grep -vx -e 'state.json' -e 'archive/manifest.json' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore(queue): mark posted"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $attempt failed; rebasing onto current main."
            # See render-batch.yml: `npm install` dirties package-lock.json, and
            # a plain `git pull --rebase` refuses to run on a dirty tree. Here
            # the stakes are higher — Postiz has already accepted the video, so
            # a failure to record it is what makes a retry post twice.
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "Rebase onto origin/main conflicted; not forcing." >&2
              exit 1
            fi
          done
          echo "Could not push state.json after three attempts." >&2
          exit 1

  notify-failure:
    needs: publish
    if: ${{ always() && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d disable_web_page_preview=true \
            -d text="Publish failed. The reason is in the run's job summary. Check Postiz before retrying: a failure during the state push can mean Postiz already accepted the video.
          $RUN_URL" || true
