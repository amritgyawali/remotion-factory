name: Render and schedule

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated ids, e.g. "day-01,day-02". Blank = whole plan.'
        required: false
        default: ""
      dry_run:
        description: "Render only, never touch Postiz"
        type: boolean
        default: false

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  # Validate once and split the plan into chunks. A GitHub job is capped at
  # 6 hours; 90 videos at 4-8 minutes each will not fit in one.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Validate plan.json
        run: node scripts/validate-plan.mjs

      - id: split
        name: Split into chunks
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            echo 'chunks=["${{ inputs.only }}"]' >> "$GITHUB_OUTPUT"
          else
            echo "chunks=$(node scripts/validate-plan.mjs --matrix 12)" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Four at a time. Higher finishes sooner but hammers the Postiz API
      # and your VPS bandwidth on upload.
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxdamage1 libgbm1 libpango-1.0-0 \
            libcairo2 fonts-liberation || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remotion
            node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-v1

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Render and schedule
        env:
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ONLY: ${{ matrix.chunk }}
          REMOTION_CONCURRENCY: 2
        run: node scripts/render-all.mjs

      - name: Archive to Cloudflare R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured, skipping archive."
            exit 0
          fi
          aws s3 sync out/ "s3://$R2_BUCKET/$(date +%Y-%m)/" \
            --endpoint-url "$R2_ENDPOINT" --exclude "*.props.json"

      - name: Keep the videos for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ strategy.job-index }}
          path: |
            out/*.mp4
            out/summary.json
          retention-days: 7
          if-no-files-found: warn

  # One message when the whole run is done, not one per chunk.
  notify:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.render.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d disable_web_page_preview=true \
            -d text="Render run finished: $RESULT
          $RUN_URL"
